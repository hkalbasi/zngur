[workspace]
members = [
    "zngur",
    "zngur-cli",
    "zngur-def",
    "zngur-generator",
    "zngur-parser",
    "zngur-autozng",
    "examples/*",
    "xtask",
    "benchmark",
    "zngur-lib",
]
# Exclude tutorial-wasm32 from default workspace builds since it requires extra dependencies
exclude = ["examples/tutorial-wasm32"]
resolver = "2"

[workspace.package]
edition = "2024"
# to support readable const asserts via const str concat
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true

[workspace.dependencies]
indexmap = "2.14.2"
ariadne = "0.6.0"
itertools = "0.15"
sha2 = "0.11.0"
hex = "0.4.3"
strip-ansi-escapes = "0.2.0"
expect-test = "1.5.1"
