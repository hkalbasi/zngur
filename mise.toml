[tools]
cspell = "9.4.0"
dprint = "0.50.2"
wasmtime = "36.0.2"

[tools."github:WebAssembly/wasi-sdk"]
version = "30"
version_prefix = "wasi-sdk-"
# Keep wasi-sdk binaries off PATH: its wasm-only clang/ar shadow the host
# toolchain and break native builds (e.g. `ar` segfaults on LTO objects).
# wasi-sdk is consumed via WASI_SDK_PATH below, never through PATH.
filter_bins = "wasm-ld"

[tools."http:emsdk"]
version = "5.0.2"
url = "https://github.com/emscripten-core/emsdk/archive/refs/tags/{{version}}.tar.gz"

[env]
WASI_SDK_PATH = { value = '{{ tools["github:WebAssembly/wasi-sdk"].path }}', tools = true }
EMSDK_PATH = { value = '{{ tools["http:emsdk"].path }}/emsdk-{{ tools["http:emsdk"].version }}', tools = true }
RUST_BACKTRACE = { value = "0" }
