[workspace]

[package]
name = "zngur-autozng"
description = "Generating Zngur zng files automatically for a Rust crate"
version = "0.11.0"
edition.workspace = true
license.workspace = true

[dependencies]
zngur-def = { version = " 0.10.0", path = "../zngur-def" }


[package.metadata.rust-analyzer]
# This crate uses #[feature(rustc_private)].
# See https://github.com/rust-analyzer/rust-analyzer/pull/7891
rustc_private = true
