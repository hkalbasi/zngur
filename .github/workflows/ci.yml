name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-mac:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        cargo_profile:
          - debug
          - release
    env:
      EXAMPLES_CARGO_PROFILE: ${{ matrix.cargo_profile }}
    steps:
      - uses: actions/checkout@v3
      - uses: jdx/mise-action@v3
      - name: Install Rust stable
        run: |
          rustup toolchain install stable
          rustup target add wasm32-wasip1
          rustup component add rustfmt
      - name: Install Clang 19
        run: brew install llvm@19
      - name: Run `cargo xtask ci`
        run: CC=$(brew --prefix llvm@19)/bin/clang CXX=$(brew --prefix llvm@19)/bin/clang++ cargo xtask ci

  build-nightly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cargo_profile:
          - debug
          - release
    env:
      CXX: g++
      EXAMPLES_CARGO_PROFILE: ${{ matrix.cargo_profile }}
    steps:
      - uses: actions/checkout@v3
      - uses: jdx/mise-action@v3
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustup target add wasm32-wasip1
          rustup component add rustfmt
      - name: Run CI (g++ nightly)
        run: cargo xtask ci

  build-win:
    runs-on: windows-2022
    strategy:
      matrix:
        cargo_profile:
          - debug
          - release
    env:
      EXAMPLES_CARGO_PROFILE: ${{ matrix.cargo_profile }}
      MISE_NPM_PACKAGE_MANAGER: npm
    steps:
      - name: Turn off autocrlf
        run: |
          git config --global core.autocrlf false
      - uses: actions/checkout@v3
      - name: Enter VS Developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022
      - uses: jdx/mise-action@v3
      - name: Install Rust stable
        run: |
          rustup toolchain install stable
          rustup target add wasm32-wasip1
          rustup component add rustfmt
      - name: Run `cargo xtask ci`
        run: cargo xtask ci

  build-nix:
    name: build-nix (ubuntu-latest, ${{ matrix.shell_name }}, ${{ matrix.cargo_profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell_name:
          - clang
          - gcc
        cargo_profile:
          - debug
          - release
    env:
      EXAMPLES_CARGO_PROFILE: ${{ matrix.cargo_profile }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        
      - name: Run `cargo xtask ci`
        run: nix develop .#${{ matrix.shell_name }} -c cargo xtask ci
